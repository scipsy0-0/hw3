services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8000"
    environment:
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
      GREETING: "${GREETING:-Hello from Compose!}"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  sqlite_data: